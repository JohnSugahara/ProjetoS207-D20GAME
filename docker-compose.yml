 
# 4 containers: postgres (Hub) + app (Dockerfile local) + mailpit (Hub) + jenkins (Hub)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-d20}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-d20_arena}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-d20}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-d20_arena}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/"]
      interval: 5s
      timeout: 3s
      retries: 10

  jenkins:
    image: ${DOCKERHUB_USER}/d20-arena-jenkins:${JENKINS_IMAGE_TAG:-1.0}
    environment:
      REPO_URL: ${REPO_URL:?defina REPO_URL no .env}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:?defina NOTIFY_EMAIL no .env}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?defina SMTP_USER no .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?defina SMTP_PASSWORD no .env}
      SMTP_FROM: ${SMTP_FROM:?defina SMTP_FROM no .env}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?defina JENKINS_ADMIN_PASSWORD no .env}
      #Para Mailpit:
    #   SMTP_HOST: ${SMTP_HOST:-mailpit}
    #   SMTP_PORT: ${SMTP_PORT:-1025}
    #   SMTP_USER: ${SMTP_USER:-}
    #   SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    #   SMTP_FROM: ${SMTP_FROM:-jenkins@d20-arena.local}
    # depends_on:
    #   mailpit:
    #     condition: service_healthy

    volumes:
      - jenkins_home:/var/jenkins_home
    ports:
      - "8080:8080"

volumes:
  pgdata:
  jenkins_home:
